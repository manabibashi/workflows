# 各リポジトリの .github/workflows/ci.yml に配置する呼び出しファイル。
# ジョブ ID「ci」は変更禁止(必須チェック名「ci / required-check」を全リポジトリで揃えるため)。

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: manabibashi/workflows/.github/workflows/ci.yml@v1
    with:
      runtime: node # node | python | none
      # runtime-version: "22"
      # working-directories: '["send-message","webhook"]' # 複数マニフェスト構成の例
      # operating-systems: '["ubuntu-latest","windows-latest"]' # 既定は ubuntu のみ。
      #   Windows でも検証するリポジトリだけ指定する(os × working-directories の matrix になり、
      #   全レッグが required-check の集約対象に入る = Windows の失敗もマージを止める)
      # lint-command: npm run lint
      test-command: npm test # テストが無いリポジトリはこの行を削除(→ automerge level は 3)
    secrets: inherit
